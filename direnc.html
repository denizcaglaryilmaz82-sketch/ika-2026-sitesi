<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Direnç kodu | İKA</title><style>body{margin:30px auto;max-width:800px;padding:0 18px;background:#101713;color:#f0f3ed;font:16px/1.6 system-ui}a{color:#c9f36a}section{background:#18221c;padding:20px;border:1px solid #34443a;border-radius:14px}button,select,input{background:#101713;color:inherit;border:1px solid #34443a;padding:9px;border-radius:7px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.f{display:grid;color:#a8b4a8;font-size:13px}.out{font-size:28px;color:#c9f36a}.bands{display:flex;gap:5px}.bands i{width:12px;height:38px}@media(max-width:550px){.grid{grid-template-columns:1fr 1fr}}</style><a href="./">← Ana sayfa</a><h1>Direnç renk kodu hesaplayıcı</h1><p>Renklerden değeri veya direnç değerinden renk kodunu bul.</p><section><button id="a">Renk → değer</button><button id="b">Değer → renk</button><div id="x"><div class="grid"><label class="f">Bant<select id="n"><option>4</option><option>5</option></select></label><label class="f">Rakam 1<select id="d"></select></label><label class="f">Rakam 2<select id="e"></select></label><label class="f" id="f">Rakam 3<select id="g"></select></label><label class="f">Çarpan<select id="m"></select></label><label class="f">Tolerans<select id="t"></select></label></div></div><div id="y" hidden class="grid"><label class="f">Değer<input id="v" value="4.7" type="number" min=".01" step="any"></label><label class="f">Birim<select id="u"><option value="1">Ω</option><option value="1000" selected>kΩ</option><option value="1e6">MΩ</option></select></label><label class="f">Bant<select id="n2"><option>4</option><option>5</option></select></label><label class="f">Tolerans<select id="t2"></select></label></div><div class="out" id="o"></div><p id="p"></p><div class="bands" id="z"></div><div id="q"></div></section><script>(()=>{let c=[['Siyah','#171717',0],['Kahverengi','#7a4528',1],['Kırmızı','#e53935',2],['Turuncu','#f28c28',3],['Sarı','#f5d547',4],['Yeşil','#388e3c',5],['Mavi','#2878c7',6],['Mor','#8e44ad',7],['Gri','#9da3a6',8],['Beyaz','#f4f4ef',9]],m=c.map((x,i)=>({n:x[0],h:x[1],v:10**i})).concat([{n:'Altın',h:'#d4af37',v:.1},{n:'Gümüş',h:'#bbb',v:.01}]),t=[['Kahverengi','#7a4528',1],['Kırmızı','#e53935',2],['Yeşil','#388e3c',.5],['Mavi','#2878c7',.25],['Mor','#8e44ad',.1],['Gri','#aaa',.05],['Altın','#d4af37',5],['Gümüş','#bbb',10],['Yok','#d8c5a0',20]],$=i=>document.getElementById(i),fill=(i,a,fn)=>$(i).innerHTML=a.map((x,j)=>'<option value="'+j+'">'+fn(x)+'</option>').join(''),fmt=v=>new Intl.NumberFormat('tr-TR',{maximumFractionDigits:3}).format(v),oh=v=>v>=1e6?fmt(v/1e6)+' MΩ':v>=1e3?fmt(v/1e3)+' kΩ':fmt(v)+' Ω';['d','e','g'].forEach(i=>fill(i,c,x=>x[0]));fill('m',m,x=>x.n+' ×'+x.v);fill('t',t,x=>x[0]+' ±'+x[2]+'%');fill('t2',t,x=>x[0]+' ±'+x[2]+'%');$('t2').value=6;function calc(){let b=[],v,tt;if(!$('y').hidden){let s=+$('n2').value===5?3:2,r=+$('v').value*+$('u').value,k=Math.floor(Math.log10(r))-s+1,d=Math.round(r/10**k);if(d>=10**s){d/=10;k++}let j=m.findIndex(x=>Math.abs(x.v-10**k)<1e-9);if(j<0){$('o').textContent='Aralık dışı';return}b=String(d).padStart(s,'0').split('').map(x=>c[+x]);b.push([m[j].n,m[j].h]);tt=t[$('t2').value];v=d*m[j].v;$('f').hidden=s===2}else{let s=+$('n').value,ds=[+$('d').value,+$('e').value];if(s===5)ds.push(+$('g').value);let mm=m[$('m').value];b=ds.map(i=>c[i]);b.push([mm.n,mm.h]);tt=t[$('t').value];v=+ds.join('')*mm.v;$('f').hidden=s===4}b.push(tt);$('o').textContent=oh(v);$('p').textContent='Tolerans ±'+fmt(tt[2])+'%';$('z').innerHTML=b.map(x=>'<i title="'+x[0]+'" style="background:'+x[1]+'"></i>').join('');$('q').textContent=b.map(x=>x[0]).join(' – ')}$('a').onclick=()=>{$('x').hidden=false;$('y').hidden=true;calc()};$('b').onclick=()=>{$('x').hidden=true;$('y').hidden=false;calc()};document.querySelectorAll('input,select').forEach(e=>e.oninput=e.onchange=calc);calc()})();</script></html>
